[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enharmonic"
version = "0.2.0"
description = "Real-time enharmonic pitch-spelling for MIDI input (Python port of the enharmonic TypeScript library)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alexis Doualle" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["music", "midi", "pitch-spelling", "enharmonic", "music-notation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://enharmonic.tonalmap.org"
Source = "https://github.com/alexisdoualle/enharmonic-py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Meredith parity (minutes in pure Python)"]
